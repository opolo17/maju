# MAJU API — deploy from repo root on Railway (New Project → Deploy from GitHub)
# Set env vars in Railway dashboard (see docs/DEPLOY.md).

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run typecheck:api"

[deploy]
startCommand = "npm run start:api"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
